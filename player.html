<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Player</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif}#adBox{width:100%;height:250px;background:#222;display:flex;align-items:center;justify-content:center}video{width:100%;max-height:90vh}</style>
<!-- Monetag ka code yaha paste karna -->
<!-- <script src="//monetag.com/pre-roll.js"></script> -->
</head><body>
<div id="adBox">AD - Monetag Pre-Roll Yaha Lagega (15 sec)</div>
<h3 id="t" style="padding:10px"></h3>
<video id="v" controls autoplay></video>
<script>
let p=new URLSearchParams(location.search); let vl=p.get('video'); let tl=p.get('title');
document.getElementById('t').innerText=tl; document.getElementById('v').src=vl;
// Monetag trigger:
// setTimeout(()=>{ document.getElementById('adBox').style.display='none'; document.getElementById('v').play(); }, 5000);
if(vl) document.getElementById('v').src=vl;
</script></body></html>
