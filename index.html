<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFA Snake Master</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a; color: white; font-family: Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; text-align: center;
        }
       .container { padding: 20px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 40px; }
       .play-btn {
            background: #22c55e; color: #0f172a; border: none;
            padding: 18px 60px; font-size: 1.5rem; font-weight: bold;
            border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
       .play-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 SNAKE MASTER</h1>
        <p>10 Challenging Levels. Beat Them All!</p>
        <button class="play-btn" onclick="goToGame()">PLAY</button>
    </div>

    <script>
        // Telegram Mini App Setup
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0f172a');
        tg.setBackgroundColor('#0f172a');

        function goToGame() {
            // Yaha tu Monetag ka ad function call kar sakta hai
            // show_11059500().then(() => {
            // window.location.href = 'play.html';
            // });

            // Filhal direct bhej raha hu. Ad ka code tu laga lena
            window.location.href = 'play.html';
        }
    </script>
</body>
</html>
