<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Panther Gamers - Watch</title>

<h2>Panther Gamers - Latest Videos</h2>
<div class="grid" id="grid"></div>
<script>
// Yaha apne videos add karna
const videos = [
  { title: "Test Video 1", thumb: "https://via.placeholder.com/300x150?text=Video+1", link: "PASTE_YOUR_DIRECT_LINK_HERE" },
];
let g=document.getElementById('grid'); videos.forEach(v=>{ g.innerHTML+=`<a class="card" href="player.html?video=${encodeURIComponent(v.link)}&title=${encodeURIComponent(v.title)}"><img src="${v.thumb}"><p>${v.title}</p></a>` });
